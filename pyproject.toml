[project]
name = "finlaya"
version = "0.1.0"
description = "FinLaya — Local Laya NIFTY Options Paper-Trading System"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "laya>=0.3.21",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "protobuf>=5.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "typer>=0.12.0",
    "upstox-python-sdk>=2.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
finlaya = "finlaya.main:app"
finlaya-dashboard = "finlaya.dashboard.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finlaya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
